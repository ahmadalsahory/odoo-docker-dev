# All values come from .env (see .env.example). The defaults below let the
# stack start even without a .env file.

# One project (and one set of volumes) per Odoo version, so switching
# ODOO_VERSION never points a newer Odoo at an older database.
name: ${PROJECT_NAME:-odoo-${ODOO_VERSION:-20}}

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  odoo:
    build:
      context: .
      args:
        ODOO_TAG: ${ODOO_TAG:-${ODOO_VERSION:-20}}
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ODOO_DB: ${ODOO_DB:-odoo}
      ODOO_DEV_MODE: ${ODOO_DEV_MODE:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ODOO_PORT:-8069}:8069"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.base.conf:ro
      - ${ENTERPRISE_ADDONS_PATH:-./addons/enterprise}:/mnt/enterprise-addons:ro
      - ${THIRD_PARTY_ADDONS_PATH:-./addons/third_party}:/mnt/third-party-addons:ro
      - ${CUSTOM_ADDONS_PATH:-./addons/custom}:/mnt/custom-addons
      - ./backups:/mnt/backups
      - odoo-data:/var/lib/odoo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8069/web/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  # Optional database UI: ./odoo.sh tools (or .\odoo.ps1 tools)
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Desktop mode: no pgAdmin login screen. Fine for a local-only tool.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  pgadmin-data:
