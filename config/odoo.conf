; Odoo server configuration for local development.
;
; These options are generated from .env at container start and should not be
; set here unless you want to override them:
;   addons_path   built from the folders in addons/ that contain modules
;   admin_passwd  ADMIN_PASSWORD
;   db_host, db_port, db_user, db_password  POSTGRES_* values
;
; Restart after editing: ./odoo.sh restart  (or .\odoo.ps1 restart)
; Full option list: https://www.odoo.com/documentation/master/developer/reference/cli.html

[options]
data_dir = /var/lib/odoo

; Listen on all interfaces inside the container (Odoo 20 defaults to 127.0.0.1,
; which Docker port publishing cannot reach). Exposure on your machine is
; controlled by BIND_ADDRESS in .env.
http_interface = 0.0.0.0

; Single process mode. Simplest for development and debugging.
workers = 0
max_cron_threads = 1

; Show the database manager (needed for creating, backing up and restoring
; databases from the browser and from the helper commands).
list_db = True

log_level = info

; There is no mail server in this stack, so outgoing emails fail and stay in the
; queue. That is usually what you want locally. Point these at a real SMTP
; server only when you need to test sending.
; smtp_server = localhost
; smtp_port = 25
